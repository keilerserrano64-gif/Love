<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- =========================================================
     CSS
     ========================================================= -->
<style>
  :root{
    --main:#ff3fa4;
    --main-rgb:255,63,164;
    --texto-neon:#ffd3ea;
  }
  body.rojo{
    --main:#ff2b3d;
    --main-rgb:255,43,61;
    --texto-neon:#ffd8d8;
  }

  /* .My_Girlfriend { position: absolute; width: 90%; font-family: "Te Amo"; } ❤ */

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Space Mono',monospace}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* ---------- Tarjeta de inicio ---------- */
  #intro{
    position:fixed;inset:0;display:grid;place-items:center;z-index:10;
    transition:opacity .9s ease, transform .9s ease;
  }
  #intro.oculto{opacity:0;transform:scale(.85);pointer-events:none}
  .tarjeta{
    width:min(330px,86vw);padding:36px 26px 30px;text-align:center;
    background:linear-gradient(160deg,#1c0a14 0%,#0a0408 100%);
    border:1px solid rgba(255,255,255,.08);border-radius:20px;
    box-shadow:0 0 70px rgba(var(--main-rgb),.18), inset 0 0 40px rgba(255,255,255,.02);
    animation:aparecer 1.2s ease both;
  }
  .tarjeta h1{font-family:'Playfair Display',serif;font-size:2.1rem;line-height:1.12}
  .tarjeta svg{width:130px;margin:18px auto 24px;display:block;overflow:visible}
  .tarjeta .corazon-svg{fill:var(--main);animation:flotar 2.4s ease-in-out infinite;transform-origin:60px 40px}
  .tarjeta .brillo{fill:#fff;animation:titilar 1.6s ease-in-out infinite}
  .tarjeta .brillo:nth-of-type(2){animation-delay:.5s}
  .tarjeta .brillo:nth-of-type(3){animation-delay:1s}

  .btn{
    border:none;cursor:pointer;background:var(--main);color:#fff;
    font-family:inherit;font-weight:700;font-size:.62rem;letter-spacing:2px;text-transform:uppercase;
    padding:11px 20px;border-radius:30px;
    box-shadow:0 0 22px rgba(var(--main-rgb),.6);
    transition:transform .2s, box-shadow .2s;
    animation:latido 1.5s ease-in-out infinite;
  }
  .btn:hover{transform:scale(1.07);box-shadow:0 0 40px rgba(var(--main-rgb),.9)}

  /* ---------- "Te Amo" ---------- */
  #teamo{
    position:fixed;top:3vh;left:50%;transform:translateX(-50%);z-index:3;
    font-family:'Great Vibes',cursive;font-size:clamp(3.2rem,10vw,6rem);
    color:var(--texto-neon);white-space:nowrap;pointer-events:none;
    text-shadow:0 0 6px var(--main),0 0 18px var(--main),0 0 40px var(--main),0 0 80px var(--main);
    opacity:0;transition:opacity 2.5s ease;
  }
  #teamo.ver{opacity:1;animation:golpe 1s cubic-bezier(.2,.9,.3,1) both,neon 4s ease-in-out 1s infinite}

  /* ---------- Controles y pista ---------- */
  #controles{
    position:fixed;right:16px;bottom:16px;z-index:4;display:flex;gap:10px;
    opacity:0;pointer-events:none;transition:opacity 1.5s;
  }
  #controles.ver{opacity:1;pointer-events:auto}
  .ctrl{
    width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.05rem;color:#fff;
    background:rgba(255,255,255,.06);border:1px solid rgba(var(--main-rgb),.5);
    backdrop-filter:blur(6px);box-shadow:0 0 14px rgba(var(--main-rgb),.35);
    transition:transform .2s, background .2s;
  }
  .ctrl:hover{transform:scale(1.1);background:rgba(var(--main-rgb),.25)}
  #pista{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;
    font-size:.65rem;letter-spacing:2px;text-transform:uppercase;opacity:0;
    color:rgba(255,255,255,.7);transition:opacity 1.5s;pointer-events:none;white-space:nowrap;
  }
  #pista.ver{opacity:1;animation:parpadeo 2.5s ease-in-out infinite}
  @media (max-width:600px){ #pista{bottom:74px;font-size:.58rem} }

  /* ---------- Modal de recuerdos ---------- */
  #modal{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:rgba(0,0,0,.55);backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #modal.abierto{opacity:1;pointer-events:auto}
  .modal-card{
    position:relative;width:min(340px,86vw);padding:30px 22px 24px;text-align:center;
    background:linear-gradient(160deg,#1c0a14,#0a0408);border-radius:20px;
    border:1px solid rgba(var(--main-rgb),.35);
    box-shadow:0 0 60px rgba(var(--main-rgb),.3);
    transform:scale(.8) translateY(20px);transition:transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  #modal.abierto .modal-card{transform:scale(1) translateY(0)}
  .modal-card .mini{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    color:var(--main);font-size:1.4rem;text-shadow:0 0 12px var(--main);
  }
  .media{
    width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;margin-bottom:18px;
    display:grid;place-items:center;font-size:5rem;
    background:radial-gradient(circle at 50% 40%,rgba(var(--main-rgb),.35),#120509 70%);
    box-shadow:inset 0 0 30px rgba(0,0,0,.6);
  }
  .media img{width:100%;height:100%;object-fit:cover}
  .media span{animation:flotar 2.4s ease-in-out infinite;display:inline-block}
  .modal-card h2{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:10px}
  .modal-card p{font-size:.72rem;line-height:1.7;opacity:.75;margin-bottom:20px}
  .btn-sec{
    background:transparent;color:#fff;cursor:pointer;font-family:inherit;font-size:.6rem;
    letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border-radius:20px;
    border:1px solid rgba(255,255,255,.3);transition:.2s;
  }
  .btn-sec:hover{border-color:var(--main);box-shadow:0 0 14px rgba(var(--main-rgb),.5)}

  /* ---------- Animaciones ---------- */
  @keyframes aparecer{from{opacity:0;transform:translateY(25px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes titilar{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
  @keyframes golpe{
    0%{opacity:0;transform:translateX(-50%) scale(3.2);filter:blur(16px) brightness(3)}
    55%{opacity:1;transform:translateX(-50%) scale(.93);filter:blur(0) brightness(2.2)}
    100%{opacity:1;transform:translateX(-50%) scale(1);filter:blur(0) brightness(1)}
  }
  @keyframes neon{0%,100%{filter:brightness(1)}48%{filter:brightness(1)}50%{filter:brightness(.6)}52%{filter:brightness(1.15)}}
  @keyframes parpadeo{0%,100%{opacity:.35}50%{opacity:.85}}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- Tarjeta inicial -->
<section id="intro">
  <div class="tarjeta">
    <h1>Para Ti</h1>
    <svg viewBox="0 0 120 100" aria-hidden="true">
      <path class="corazon-svg" d="M60 30 C60 18 42 16 42 30 C42 40 60 48 60 56 C60 48 78 40 78 30 C78 16 60 18 60 30Z"/>
      <circle class="brillo" cx="30" cy="22" r="2"/>
      <circle class="brillo" cx="92" cy="18" r="2.4"/>
      <circle class="brillo" cx="98" cy="40" r="1.6"/>
      <rect x="22" y="48" width="76" height="46" rx="6" fill="#fff"/>
      <path d="M22 51 L60 76 L98 51" fill="none" stroke="#ead7df" stroke-width="2.2"/>
      <path d="M24 92 L50 71 M96 92 L70 71" stroke="#f1e4e9" stroke-width="2"/>
    </svg>
    <button class="btn" id="btnAbrir">Para el amor de mi vida ♥</button>
  </div>
</section>

<h1 id="teamo">Te Amo</h1>
<p id="pista">Toca las burbujas ♥ · arrastra para girar</p>

<div id="controles">
  <button class="ctrl" id="btnColor" title="Cambiar color">🎨</button>
  <button class="ctrl" id="btnRepetir" title="Repetir">↺</button>
</div>

<div id="modal">
  <div class="modal-card">
    <span class="mini">♥</span>
    <div class="media" id="mMedia"></div>
    <h2 id="mTitulo"></h2>
    <p id="mTexto"></p>
    <button class="btn-sec" id="mVolver">Volver ♥</button>
  </div>
</div>

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->
<script>
/* =========== ✏️ PERSONALIZA AQUÍ =========== */
const CONFIG = {
  musica: "",         // ej: "cancion.mp3" (pon el mp3 en la misma carpeta)
  // nombres de las constelaciones: corazón, estrella, luna e infinito
  constelaciones: ["Tú y yo", "Mi estrella", "Nuestras noches", "Para siempre"],
  frases: [
    "FELIZ DÍA DE LA NOVIA ♥", "TE AMO", "PARA EL AMOR DE MI VIDA", "TE ADORO",
    "LA MEJOR NOVIA ♥", "ERES MI TODO", "AMOR DE MI VIDA", "ERES MAGIA",
    "TE AMO CON LOCURA", "MI PERSONA FAVORITA", "HOY CELEBRAMOS ♥", "MY EVERYTHING"
  ],
  // foto: pon la ruta de una imagen (ej: "foto1.jpg"). Si está vacía se usa el emoji.
  recuerdos: [
    { emoji:"💖", foto:"", titulo:"Amor de mi Vida",  texto:"Cuanto más tiempo estamos juntos, más te amo." },
    { emoji:"🌸", foto:"", titulo:"Para ti",          texto:"Por lo que haces latir mi corazón de una forma única. En cada recuerdo y en cada latido, estás tú." },
    { emoji:"✈️", foto:"", titulo:"Aventuras juntos", texto:"No hay lugar en el mundo donde prefiera estar que a tu lado, descubriendo lugares nuevos." },
    { emoji:"🧸", foto:"", titulo:"Mi lugar seguro",  texto:"Tus abrazos son mi lugar favorito en todo el universo." },
    { emoji:"🌙", foto:"", titulo:"Nuestras noches",  texto:"Las mejores conversaciones son contigo, hasta que se nos olvida la hora." },
    { emoji:"💌", foto:"", titulo:"Una promesa",      texto:"Prometo seguir eligiéndote todos los días, en los buenos y en los no tan buenos." },
    { emoji:"🍓", foto:"", titulo:"Lo dulce",         texto:"Contigo hasta lo más simple se vuelve especial." }
  ]
};
/* ========================================== */

const TEMAS = {
  rosa: { hue:325, rgb:"255,63,164", css:"rgb(255,63,164)" },
  rojo: { hue:356, rgb:"255,43,61", css:"rgb(255,43,61)" }
};
let tema = TEMAS.rosa, PAL = [];
function crearPaleta(){
  PAL = [];
  for(let l=0;l<16;l++) PAL.push(`hsl(${tema.hue},100%,${34 + l*4}%)`);
}
crearPaleta();

/* ---------- Utilidades ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const suave=t=>t*t*(3-2*t);
const salida=t=>1-Math.pow(1-t,3);
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const TAU=Math.PI*2;

/* ---------- Canvas y cámara ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
let W,H,DPR,U,CX,CY,CX0,CY0,SZ;
const FOC=1.7;
const cam={rot:0,off:0,tilt:0.42,zoom:1};
let cr=1,sr=0,ct=1,st=0,empuje=1;
const calma=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P={x:0,y:0,s:0,z:0};

// El cielo (solo degradados suaves) se pinta en pequeño y se amplía: se ve igual y cuesta mucho menos
const cvCielo=document.createElement('canvas'), ctxCielo=cvCielo.getContext('2d',{alpha:false});
let ultimoCielo=-1;
// Sube cuando hay que rehacer las imágenes guardadas (cambio de tema, tamaño o fuentes)
let gen=0;
function invalidar(){gen++;ultimoCielo=-1;}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  U=Math.min(W*0.76,H*0.86);
  CX=CX0=W/2;CY=CY0=H*0.56;SZ=U/430;
  cvCielo.width=Math.ceil(W/8);cvCielo.height=Math.ceil(H/8);
  ctxCielo.setTransform(cvCielo.width/W,0,0,cvCielo.height/H,0,0);
  invalidar();
}
addEventListener('resize',resize);resize();

// Proyecta un punto 3D (y hacia arriba) a la pantalla
function proj(x,y,z,o=P,c=cr,s=sr){
  const x1=x*c-z*s, z1=x*s+z*c;
  const y2=y*ct+z1*st, z2=-y*st+z1*ct;
  const d=FOC+z2;
  if(d<0.15){o.s=0;return o;}
  const k=FOC/d*cam.zoom*empuje;
  o.x=CX+x1*k*U; o.y=CY-y2*k*U; o.s=k; o.z=z2;
  return o;
}

/* ---------- Imágenes guardadas: lo costoso se dibuja una vez y se reutiliza ---------- */
function lienzo(c,w,h,esc=DPR){
  c=c||document.createElement('canvas');
  c.width=Math.ceil(w*esc);c.height=Math.ceil(h*esc);
  c.getContext('2d').setTransform(esc,0,0,esc,0,0);
  return c;
}
// Solo la sombra borrosa: la figura se dibuja fuera del lienzo y la sombra cae dentro.
// La figura nítida se sigue dibujando en cada cuadro, así no pierde definición.
const LEJOS=10000;
function preparaSombra(x,blur){
  x.shadowColor=tema.css;x.shadowBlur=blur;x.shadowOffsetX=LEJOS;x.fillStyle='#000';
}
function sombraTexto(o,txt,px,font,blur){
  if(o.som&&o.somGen===gen&&Math.abs(px/o.somPx-1)<0.04) return;
  ctx.font=font;
  const pad=blur+8, c=lienzo(o.som,ctx.measureText(txt).width+pad*2,px*1.6+pad*2), x=c.getContext('2d');
  x.font=font;x.textAlign='center';x.textBaseline='middle';
  preparaSombra(x,blur);
  x.fillText(txt,(c.width-LEJOS)/DPR-c.width/DPR/2,c.height/DPR/2);
  o.som=c;o.somPx=px;o.somGen=gen;
}
function sombraCirculo(o,r,blur){
  if(o.som&&o.somGen===gen&&Math.abs(r/o.somPx-1)<0.04) return;
  const lado=2*(r+blur+8), c=lienzo(o.som,lado,lado), x=c.getContext('2d'), m=c.width/DPR/2;
  preparaSombra(x,blur);
  x.beginPath();x.arc(m-LEJOS/DPR,m,r,0,TAU);x.fill();
  o.som=c;o.somPx=r;o.somGen=gen;
}
function ponerSombra(o,x,y,tam){
  const k=tam/o.somPx, w=o.som.width/DPR*k, h=o.som.height/DPR*k;
  ctx.drawImage(o.som,x-w/2,y-h/2,w,h);
}
const brilloChico={}, brilloGrande={}, brilloEsfera={}, luzNucleo={};
function degradado(o,lado,paradas){
  if(o.img&&o.gen===gen) return o.img;
  const c=lienzo(o.img,lado,lado,1), x=c.getContext('2d'), m=lado/2;
  const g=x.createRadialGradient(m,m,0,m,m,m);
  for(const [p,color] of paradas) g.addColorStop(p,color);
  x.fillStyle=g;x.fillRect(0,0,lado,lado);
  o.img=c;o.gen=gen;
  return c;
}

/* ---------- Partículas: galaxia ---------- */
const movil=innerWidth<700;
const disco=[];
const ND=movil?2600:4300;
for(let i=0;i<ND;i++){
  let r,a;
  if(Math.random()<0.75){
    r=0.07+Math.pow(Math.random(),0.9)*0.6;
    a=(i%3)*TAU/3 + r*6.5 + gauss()*0.45*(0.4+r);
  }else{
    r=0.07+Math.sqrt(Math.random())*0.62;
    a=Math.random()*TAU;
  }
  let br=1-(r-0.07)/0.62;
  br=clamp(br*0.8+Math.random()*0.35);
  const th=Math.random()*TAU, ph=Math.acos(2*Math.random()-1), dist=0.3+Math.random()*1.5;
  disco.push({
    r,a,y:gauss()*0.012*(1.2-r),lv:Math.floor(br*15),s:0.7+Math.random()*1.3,
    w:0.09/Math.sqrt(r),
    dx:Math.sin(ph)*Math.cos(th)*dist, dy:Math.cos(ph)*dist*0.6, dz:Math.sin(ph)*Math.sin(th)*dist,
    del:Math.random()*0.8
  });
}
disco.sort((p,q)=>p.lv-q.lv);

/* ---------- Partículas: corazón ---------- */
const HC=0.33;
const corazon=[];
const NH=movil?1100:1700;
for(let i=0;i<NH;i++){
  const t=Math.random()*TAU;
  let x=16*Math.pow(Math.sin(t),3);
  let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  const k=Math.random()<0.68 ? 1-Math.abs(gauss())*0.07 : Math.sqrt(Math.random());
  x*=k*0.0115; y*=k*0.0115;
  corazon.push({x, y:y+HC, z:gauss()*0.035*k, lv:9+Math.floor(Math.random()*7),
    s:0.6+Math.random()*1.1, del:Math.random()*0.8, sx:gauss()*0.02, sz:gauss()*0.02, tw:Math.random()*TAU});
}
corazon.sort((p,q)=>p.lv-q.lv);

/* ---------- Partículas: fuente central ---------- */
const fuente=[];
for(let i=0;i<(movil?180:280);i++){
  fuente.push({f:Math.random(), a:Math.random()*TAU, r:Math.random()*0.035, v:0.5+Math.random()*0.6, lv:8+Math.floor(Math.random()*8)});
}
fuente.sort((p,q)=>p.lv-q.lv);

/* ---------- Fondo: estrellas y corazoncitos ---------- */
const estrellas=Array.from({length:movil?160:300},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+0.2,f:Math.random()*TAU}));
const corazoncitos=Array.from({length:movil?12:20},()=>({x:Math.random(),y:Math.random(),v:0.01+Math.random()*0.025,t:8+Math.random()*14,f:Math.random()*TAU}));
const nebulosas=[
  {x:0.1,y:0.28,r:0.5,rgb:null,f:0},
  {x:0.9,y:0.72,r:0.55,rgb:null,f:2},
  {x:0.88,y:0.16,r:0.38,rgb:"130,70,255",f:4},
  {x:0.12,y:0.86,r:0.42,rgb:"130,70,255",f:1}
];

/* ---------- Constelaciones a los lados ---------- */
const figuras=[
  // corazón
  Array.from({length:12},(_,i)=>{
    const t=i*TAU/12;
    return [Math.pow(Math.sin(t),3)*0.5,
      -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/32];
  }),
  // estrella
  Array.from({length:10},(_,i)=>{
    const a=i*TAU/10-Math.PI/2, r=i%2?0.2:0.5;
    return [Math.cos(a)*r,Math.sin(a)*r];
  }),
  // luna
  [...Array.from({length:7},(_,i)=>{
    const a=Math.PI/2+i*Math.PI/6;
    return [Math.cos(a)*0.46+0.14,Math.sin(a)*0.46];
  }),...Array.from({length:5},(_,i)=>{
    const a=Math.PI*4/3-i*Math.PI/6;
    return [Math.cos(a)*0.16+0.14,Math.sin(a)*0.46];
  })],
  // infinito
  Array.from({length:14},(_,i)=>{
    const t=i*TAU/14, d=1+Math.sin(t)*Math.sin(t);
    return [Math.cos(t)*0.55/d,Math.sin(t)*Math.cos(t)*0.75/d];
  })
];
const constelaciones=figuras.map((pts,i)=>({pts,nombre:CONFIG.constelaciones[i]||"",x:0,y:0,S:0}));

// Las ubica en el espacio libre: a los lados en horizontal, arriba y abajo en vertical
function ubicarConstelaciones(){
  let xs,ys,S;
  if(W>H){
    const m=Math.max((W-U*1.3)/2,W*0.12);
    xs=[m*0.5,W-m*0.5]; ys=[H*0.27,H*0.73];
    S=Math.min(m*0.8,H*0.26);
  }else{
    const sup=H*0.03+clamp(W*0.1,51,96)*1.25, ini=CY0-U*0.43, fin=CY0+U*0.38, inf=H-115;
    xs=[W*0.27,W*0.73]; ys=[(sup+ini)/2,(fin+inf)/2];
    S=Math.min(W*0.36,(ini-sup)*0.62,(inf-fin)*0.62);
  }
  constelaciones.forEach((c,i)=>{c.x=xs[i%2];c.y=ys[i>>1];c.S=S;});
}
addEventListener('resize',ubicarConstelaciones);ubicarConstelaciones();

let fugaz=null, proxFugaz=0;

/* ---------- Entrada: carga, explosión y ondas ---------- */
const PRE=1.4;   // segundos de carga antes de la explosión
const succion=Array.from({length:movil?170:340},()=>({a:Math.random()*TAU,d:0.55+Math.random()*0.6,del:Math.random()*0.6,lv:8+Math.floor(Math.random()*8)}));
const chispas=Array.from({length:movil?240:460},()=>({a:Math.random()*TAU,v:0.25+Math.pow(Math.random(),1.6)*1.5,w:0.8+Math.random()*1.8,lv:6+Math.floor(Math.random()*10)}));
succion.sort((p,q)=>p.lv-q.lv);
chispas.sort((p,q)=>p.lv-q.lv);
const ONDAS=[[0,1.7],[0.16,1.4],[0.38,1.1],[5,0.8],[5.18,0.55]];   // [momento, tamaño]

/* ---------- Frases y burbujas ---------- */
const ANILLOS=[0.34,0.46,0.58];
const frases=CONFIG.frases.map((txt,i)=>({txt, r:ANILLOS[i%3], a:i*TAU/CONFIG.frases.length, al:0, vis:0, s:0, x:0, y:0, w:0, h:0, px:12}));
const ordenFrases=[...frases];
const burbujas=CONFIG.recuerdos.map((m,i)=>{
  const b={...m, r:0.27+((i*0.53)%1)*0.32, a:i*TAU/CONFIG.recuerdos.length+0.4, h:0.045+Math.random()*0.04, f:Math.random()*TAU, sx:0,sy:0,R:0,z:0, img:null};
  if(m.foto){b.img=new Image();b.img.src=m.foto;}
  return b;
});

const ordenBurbujas=[...burbujas];

/* ---------- Estado ---------- */
let t0=null, mostrado=false, musica=null, ultimoMs=0;
const $=id=>document.getElementById(id);

/* ---------- Dibujo ---------- */
function pintarCielo(T,now){
  const c=ctxCielo;
  c.globalCompositeOperation='source-over';
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.7);
  const a=T>0?0.16*clamp(T/3):0.08;
  g.addColorStop(0,`rgba(${tema.rgb},${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);

  // nebulosas que respiran en los costados
  c.globalCompositeOperation='lighter';
  const an=T>0?0.6+0.4*clamp(T/4):0.6;
  for(const n of nebulosas){
    const nx=n.x*W, ny=n.y*H, nr=n.r*Math.max(W,H);
    const ng=c.createRadialGradient(nx,ny,0,nx,ny,nr);
    const na=an*(0.13+0.04*Math.sin(now*0.35+n.f));
    ng.addColorStop(0,`rgba(${n.rgb||tema.rgb},${na})`);ng.addColorStop(1,`rgba(${n.rgb||tema.rgb},0)`);
    c.fillStyle=ng;c.fillRect(nx-nr,ny-nr,nr*2,nr*2);
  }
}

function spriteCorazoncito(c){
  if(c.spr&&c.sprGen===gen) return;
  const lado=c.t*1.8, img=lienzo(c.spr,lado,lado), x=img.getContext('2d');
  x.font=`${c.t}px serif`;x.textAlign='center';x.textBaseline='middle';
  x.fillStyle=tema.css;
  x.fillText('♥',img.width/DPR/2,img.height/DPR/2);
  c.spr=img;c.sprGen=gen;
}

function fondo(T,now){
  // cambia muy despacio, no hace falta repintarlo en cada cuadro
  if(ultimoCielo<0||now<ultimoCielo||now-ultimoCielo>=0.05){pintarCielo(T,now);ultimoCielo=now;}
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.drawImage(cvCielo,0,0,W,H);

  ctx.fillStyle='#fff';
  for(const e of estrellas){
    ctx.globalAlpha=0.25+0.55*Math.abs(Math.sin(now*0.8+e.f));
    ctx.fillRect(e.x*W,e.y*H,e.r,e.r);
  }
  for(const c of corazoncitos){
    c.y-=c.v*0.016; if(c.y<-0.05){c.y=1.05;c.x=Math.random();}
    spriteCorazoncito(c);
    ctx.globalAlpha=0.18+0.12*Math.sin(now+c.f);
    const m=c.spr.width/DPR/2;
    ctx.drawImage(c.spr,c.x*W+Math.sin(now*0.7+c.f)*14-m,c.y*H-m,m*2,m*2);
  }
}

function dibujarConstelaciones(T,now){
  const T0=4.5;
  if(T<T0) return;
  ctx.textAlign='center';ctx.textBaseline='middle';
  constelaciones.forEach((c,i)=>{
    const t=T-T0-i*0.8;
    if(t<=0||c.S<40) return;
    const n=c.pts.length, prog=clamp(t/3.2)*n;
    const flota=Math.sin(now*0.5+i*1.7)*4;
    const px=j=>c.x+c.pts[j%n][0]*c.S, py=j=>c.y+flota+c.pts[j%n][1]*c.S;

    // líneas que se van trazando de estrella en estrella
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=tema.css;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px(0),py(0));
    const fin=Math.floor(prog);
    for(let j=1;j<=fin;j++) ctx.lineTo(px(j),py(j));
    if(fin<n){
      const f=prog-fin;
      ctx.lineTo(px(fin)+(px(fin+1)-px(fin))*f,py(fin)+(py(fin+1)-py(fin))*f);
    }
    ctx.stroke();

    // estrellas
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#fff';
    sombraCirculo(brilloChico,1.5,10);sombraCirculo(brilloGrande,2.3,10);
    for(let j=0;j<n;j++){
      if(prog<j) break;
      ctx.globalAlpha=clamp((prog-j)*2)*(0.65+0.35*Math.sin(now*2+j*1.9+i));
      const X=px(j), Y=py(j), r=j%3?1.5:2.3;
      ponerSombra(j%3?brilloChico:brilloGrande,X,Y,r);
      ctx.beginPath();ctx.arc(X,Y,r,0,TAU);ctx.fill();
    }

    // nombre
    const al=clamp((t-3)/1.5);
    if(al>0&&c.nombre){
      const pn=Math.max(17,Math.min(30,c.S*0.15)), fn=`${pn}px 'Great Vibes', cursive`;
      const yn=c.y+flota+c.S*0.5+Math.max(17,c.S*0.14);
      sombraTexto(c,c.nombre,pn,fn,10);
      ctx.globalAlpha=al*0.9;
      ponerSombra(c,c.x,yn,pn);
      ctx.fillStyle='rgb(255,215,235)';
      ctx.font=fn;
      ctx.fillText(c.nombre,c.x,yn);
    }
  });
}

function dibujarFugaz(T,now){
  if(T<2) return;
  if(!fugaz&&now>proxFugaz){
    const dir=Math.random()<0.5?1:-1;
    fugaz={x:W*(dir>0?Math.random()*0.5:0.5+Math.random()*0.5),y:H*Math.random()*0.4,dx:dir*Math.max(W,H)*0.55,dy:Math.max(W,H)*0.24,t0:now};
  }
  if(!fugaz) return;
  const v=(now-fugaz.t0)/0.9;
  if(v>=1){fugaz=null;proxFugaz=now+1.5+Math.random()*3.5;return;}
  const x=fugaz.x+fugaz.dx*v, y=fugaz.y+fugaz.dy*v;
  const g=ctx.createLinearGradient(x,y,x-fugaz.dx*0.28,y-fugaz.dy*0.28);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(0.35,`rgba(${tema.rgb},.55)`);g.addColorStop(1,`rgba(${tema.rgb},0)`);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.sin(v*Math.PI);
  ctx.strokeStyle=g;ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-fugaz.dx*0.28,y-fugaz.dy*0.28);ctx.stroke();
}

function dibujarDisco(T){
  const pb=salida(clamp(T/1.1));
  const armado=T>=3.2;   // ya todas llegaron a su órbita: no hace falta mezclar posiciones
  const zoom=cam.zoom*empuje, cx=CX, cy=CY, ku=U, kt=SZ, co=cr, se=sr, ci=ct, si=st;
  ctx.globalCompositeOperation='lighter';
  let lv=-1;
  for(let i=0,n=disco.length;i<n;i++){
    const p=disco[i], ang=p.a+T*p.w;
    let x=p.r*Math.cos(ang), y=p.y, z=p.r*Math.sin(ang);
    if(!armado){
      const q=suave(clamp((T-0.9-p.del)/1.5));
      const bx=p.dx*pb, by=p.dy*pb, bz=p.dz*pb;
      x=bx+(x-bx)*q; y=by+(y-by)*q; z=bz+(z-bz)*q;
    }
    const x1=x*co-z*se, z1=x*se+z*co;
    const d=FOC-y*si+z1*ci;
    if(d<0.15) continue;
    if(p.lv!==lv){lv=p.lv;ctx.fillStyle=PAL[lv];ctx.globalAlpha=Math.min(1,0.35+lv/20);}
    const k=FOC/d*zoom, t=p.s*k*kt, sz=t>0.6?t:0.6;
    ctx.fillRect(cx+x1*k*ku-sz/2,cy-(y*ci+z1*si)*k*ku-sz/2,sz,sz);
  }
}

function dibujarNucleo(T){
  const a=suave(clamp((T-1.5)/1.5));
  if(a<=0) return;
  proj(0,0,0);
  const x=P.x,y=P.y,R=0.17*U*P.s,sy=Math.max(0.15,st);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.drawImage(degradado(luzNucleo,512,[
    [0,'rgba(255,255,255,0)'],
    [0.18,'rgba(255,240,250,.95)'],
    [0.32,`rgba(${tema.rgb},.85)`],
    [0.6,`rgba(${tema.rgb},.25)`],
    [1,`rgba(${tema.rgb},0)`]
  ]),x-R,y-R*sy,R*2,R*2*sy);

  // esfera negra (el "agujero negro")
  const r0=0.03*U*P.s;
  sombraCirculo(brilloEsfera,r0,18);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=a;
  ponerSombra(brilloEsfera,x,y-r0*0.45,r0);
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(x,y-r0*0.45,r0,0,TAU);ctx.fill();
  ctx.strokeStyle=`rgba(${tema.rgb},.8)`;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(x,y-r0*0.45,r0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
}

function dibujarFuente(T){
  const a=suave(clamp((T-3.4)/1.2));
  if(a<=0) return;
  ctx.globalCompositeOperation='lighter';
  let lv=-1;
  for(const f of fuente){
    const life=(T*f.v*0.6+f.f)%1;
    const rr=f.r*(1-life*0.6);
    const ang=f.a+T*2;
    proj(Math.cos(ang)*rr, life*0.16, Math.sin(ang)*rr);
    if(!P.s) continue;
    if(f.lv!==lv){lv=f.lv;ctx.fillStyle=PAL[lv];}
    ctx.globalAlpha=a*Math.sin(life*Math.PI);
    const sz=Math.max(0.8,1.4*P.s*SZ);
    ctx.fillRect(P.x-sz/2,P.y-sz/2,sz,sz);
  }
}

function dibujarCorazon(T){
  if(T<3.6) return;
  const giro=Math.sin(T*0.6)*0.35, hc=Math.cos(giro), hs=Math.sin(giro);
  const beat=1+0.06*Math.pow(Math.max(0,Math.sin(T*3.4)),10)+0.03*Math.pow(Math.max(0,Math.sin(T*3.4-0.6)),10)
    +(T>5?0.32*Math.exp(-(T-5)*5):0);   // golpe cuando termina de formarse
  const armado=T>=5.6;   // el corazón ya terminó de formarse
  const zoom=cam.zoom*empuje, cx=CX, cy=CY, ku=U, kt=SZ, ci=ct, si=st;
  ctx.globalCompositeOperation='lighter';
  let lv=-1;
  for(let i=0,n=corazon.length;i<n;i++){
    const p=corazon[i];
    const q=armado?1:suave(clamp((T-3.6-p.del)/1.2));
    if(q<=0) continue;
    let x=p.x*beat, y=HC+(p.y-HC)*beat, z=p.z*beat;
    if(!armado){x=p.sx+(x-p.sx)*q; y*=q; z=p.sz+(z-p.sz)*q;}
    const x1=x*hc-z*hs, z1=x*hs+z*hc;
    const d=FOC-y*si+z1*ci;
    if(d<0.15) continue;
    if(p.lv!==lv){lv=p.lv;ctx.fillStyle=PAL[lv];}
    ctx.globalAlpha=q*(0.55+0.45*Math.sin(T*3+p.tw));
    const k=FOC/d*zoom, t=p.s*k*kt, sz=t>0.6?t:0.6;
    ctx.fillRect(cx+x1*k*ku-sz/2,cy-(y*ci+z1*si)*k*ku-sz/2,sz,sz);
  }
}

const letraFrase=px=>`700 ${px}px 'Space Mono', monospace`;
const tocaFrase=(o,f,m)=>Math.abs(o.x-f.x)<(o.w+f.w)/2+m&&Math.abs(o.y-f.y)<(o.h+f.h)/2+m*0.5;
const turnoFrase=f=>f.al>0.5?(f.vis<10?2:0):1;
const ordenTurno=(p,q)=>turnoFrase(q)-turnoFrase(p)||q.s-p.s;

function dibujarFrases(T,dt,ab){
  const a=suave(clamp((T-5.4)/1.6));
  if(a<=0) return;
  ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of frases){
    const th=f.a+T*0.07;
    proj(f.r*Math.cos(th),0.006,f.r*Math.sin(th));
    f.s=P.s;
    if(!P.s) continue;
    f.px=clamp(U*0.026*P.s,11,20);
    if(f.anchoGen!==gen){ctx.font=letraFrase(20);f.ancho20=ctx.measureText(f.txt).width;f.anchoGen=gen;}
    f.w=f.ancho20*f.px/20+8; f.h=f.px*1.3;
    f.x=clamp(P.x,f.w/2+6,W-f.w/2-6); f.y=P.y;
  }

  // Zonas ocupadas: el corazón y las burbujas
  proj(0,0.47,0);
  const arriba=P.y, ancho=0.42*U*P.s;
  proj(0,0,0);
  const ocupado=[{x:P.x,y:(arriba+P.y)/2,w:ancho,h:P.y-arriba+0.1*U}];
  if(ab>0) for(const b of burbujas) if(b.R) ocupado.push({x:b.sx,y:b.sy,w:b.R*2,h:b.R*2});

  // Si no hay espacio, el mensaje se desvanece. Los recién aparecidos tienen prioridad
  // y tras 10 s ceden su lugar, así todos se turnan. Pide más margen para aparecer
  // que para quedarse, y no aparece hasta que el otro se haya apagado.
  ordenFrases.sort(ordenTurno);
  for(const f of ordenFrases){
    if(!f.s){f.al=0;continue;}
    const m=f.al>0.5?8:26;
    const libre=!ocupado.some(o=>tocaFrase(o,f,m));
    const sube=libre&&!frases.some(o=>o!==f&&o.al>0.1&&tocaFrase(o,f,0));
    f.al=clamp(f.al+(sube?dt*1.6:libre?0:-dt*4));
    f.vis=f.al>0.5?f.vis+dt:0;
    if(libre||f.al>0.05) ocupado.push(f);
  }

  ctx.lineJoin='round';
  for(const f of frases){
    if(!f.s||f.al<=0) continue;
    const fn=letraFrase(f.px);
    sombraTexto(f,f.txt,f.px,fn,10);
    ctx.globalAlpha=a*f.al*clamp(0.6+(f.s-0.75)*1.2,0.6,1);
    ctx.font=fn;
    ctx.strokeStyle='rgba(10,0,6,.85)';ctx.lineWidth=f.px*0.28;
    ctx.strokeText(f.txt,f.x,f.y);
    ponerSombra(f,f.x,f.y,f.px);
    ctx.fillStyle='rgb(255,228,242)';
    ctx.fillText(f.txt,f.x,f.y);
  }
}

function calcularBurbujas(T){
  for(const b of burbujas){
    const th=b.a+T*0.06;
    proj(b.r*Math.cos(th), b.h+Math.sin(T*1.5+b.f)*0.012, b.r*Math.sin(th));
    b.sx=P.x;b.sy=P.y;b.z=P.z;b.R=P.s?0.042*U*P.s:0;
  }
}
// Cada burbuja se guarda ya dibujada y solo se rehace si cambia bastante de tamaño.
// Se guarda con más resolución para que siga nítida al moverse entre píxeles.
const NITIDEZ=1.5;
function spriteBurbuja(b){
  const foto=!!(b.img&&b.img.complete&&b.img.naturalWidth), atras=b.z>0;
  if(b.spr&&b.sprGen===gen&&b.sprFoto===foto&&b.sprAtras===atras&&Math.abs(b.R/b.sprR-1)<0.03) return;
  const R=b.R, esc=DPR*NITIDEZ, c=lienzo(b.spr,2*(R+28),2*(R+28),esc), x=c.getContext('2d');
  const m=c.width/esc/2, opaco=atras?0.75:1;
  x.globalAlpha=opaco;
  x.save();
  x.shadowColor=tema.css;x.shadowBlur=20*NITIDEZ;
  const g=x.createRadialGradient(m-R*0.3,m-R*0.3,R*0.1,m,m,R);
  g.addColorStop(0,'#3a1426');g.addColorStop(1,'#12050b');
  x.fillStyle=g;x.beginPath();x.arc(m,m,R,0,TAU);x.fill();
  x.restore();
  if(foto){
    x.save();x.beginPath();x.arc(m,m,R*0.92,0,TAU);x.clip();
    const iw=b.img.naturalWidth,ih=b.img.naturalHeight,s=Math.max(2*R/iw,2*R/ih);
    x.drawImage(b.img,m-iw*s/2,m-ih*s/2,iw*s,ih*s);
    x.restore();
  }else{
    x.textAlign='center';x.textBaseline='middle';
    x.font=`${R*1.05}px serif`;
    x.fillStyle='rgb(255,228,242)';
    x.fillText(b.emoji,m,m+R*0.08);
  }
  x.lineWidth=Math.max(1.5,R*0.07);
  x.strokeStyle=`rgba(255,220,238,.9)`;
  x.beginPath();x.arc(m,m,R,0,TAU);x.stroke();
  // reflejo
  x.globalAlpha=opaco*0.5;
  x.strokeStyle='#fff';x.lineWidth=Math.max(1,R*0.06);
  x.beginPath();x.arc(m,m,R*0.75,Math.PI*1.1,Math.PI*1.4);x.stroke();
  b.spr=c;b.sprR=R;b.sprFoto=foto;b.sprAtras=atras;b.sprGen=gen;
}
function dibujarBurbuja(b,alpha){
  if(!b.R) return;
  spriteBurbuja(b);
  const m=b.spr.width/(DPR*NITIDEZ)/2*b.R/b.sprR;
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=alpha;
  ctx.drawImage(b.spr,b.sx-m,b.sy-m,m*2,m*2);
}

function dibujarCarga(now){
  const c=clamp(1-(t0-now)/PRE);
  // la luz se apaga mientras todo cae hacia el centro
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=0.8*c;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation='lighter';
  const lejos=Math.max(W,H);
  ctx.lineWidth=1.4;
  let lv=-1;
  for(const s of succion){
    let l=clamp((c-s.del)/(1-s.del));
    if(l<=0) continue;
    l=l*l*l;
    const r=s.d*lejos*(1-l), cola=20+lejos*0.14*l, dx=Math.cos(s.a), dy=Math.sin(s.a);
    ctx.globalAlpha=Math.min(1,l*4+0.15);
    if(s.lv!==lv){lv=s.lv;ctx.strokeStyle=PAL[lv];}
    ctx.beginPath();ctx.moveTo(CX+dx*r,CY+dy*r);ctx.lineTo(CX+dx*(r+cola),CY+dy*(r+cola));ctx.stroke();
  }

  // núcleo con dos latidos, y se contrae justo antes de estallar
  const pulso=Math.exp(-Math.pow((c-0.42)/0.05,2))+1.4*Math.exp(-Math.pow((c-0.74)/0.05,2));
  const R=U*(0.02+0.07*c*c+0.05*pulso)*(c>0.92?(1-c)/0.08:1);
  if(R>0.5){
    const g=ctx.createRadialGradient(CX,CY,0,CX,CY,R*3);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,235,245,.9)');
    g.addColorStop(0.5,`rgba(${tema.rgb},.55)`);g.addColorStop(1,`rgba(${tema.rgb},0)`);
    ctx.globalAlpha=1;
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,R*3,0,TAU);ctx.fill();
  }
}

function dibujarChispas(T){
  const dur=1.9;
  if(T>=dur) return;
  const av=salida(clamp(T/dur)), va=Math.pow(1-T/dur,1.4);
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  ctx.globalAlpha=va;
  let lv=-1;
  for(const c of chispas){
    const r=c.v*U*av, dx=Math.cos(c.a), dy=Math.sin(c.a)*0.8;
    if(c.lv!==lv){lv=c.lv;ctx.strokeStyle=PAL[lv];}
    ctx.lineWidth=c.w;
    ctx.beginPath();ctx.moveTo(CX+dx*r*0.86,CY+dy*r*0.86);ctx.lineTo(CX+dx*r,CY+dy*r);ctx.stroke();
  }
}

function dibujarOndas(T){
  ctx.globalCompositeOperation='lighter';
  for(const [ti,tam] of ONDAS){
    const t=(T-ti)/1.5;
    if(t<=0||t>=1) continue;
    const R=tam*U*salida(t), Ry=R*Math.max(0.25,st), va=Math.pow(1-t,2);
    ctx.strokeStyle=tema.css;
    ctx.globalAlpha=va*0.45;ctx.lineWidth=2+(1-t)*22;
    ctx.beginPath();ctx.ellipse(CX,CY,R,Ry,0,0,TAU);ctx.stroke();
    ctx.strokeStyle='#fff';
    ctx.globalAlpha=va;ctx.lineWidth=1+(1-t)*3;
    ctx.beginPath();ctx.ellipse(CX,CY,R,Ry,0,0,TAU);ctx.stroke();
  }
}

function destello(T){
  if(T>=1.6) return;
  const a=Math.pow(1-T/1.6,2.2)*(calma?0.35:1);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=a;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,U*1.4);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,`rgba(${tema.rgb},.7)`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// Temblor de pantalla: carga, explosión y el golpe del corazón
function sacudir(T,now){
  let amp=0;
  if(t0!==null&&now<t0){const c=clamp(1-(t0-now)/PRE);amp=7*c*c;}
  else if(T>=0&&T<1) amp=28*Math.pow(1-T,2);
  else if(T>=5&&T<5.5) amp=12*Math.pow(1-(T-5)/0.5,2);
  if(calma) amp=0;
  CX=CX0+(Math.random()-0.5)*2*amp;
  CY=CY0+(Math.random()-0.5)*2*amp;
}

/* ---------- Bucle principal ---------- */
const ordenProfundidad=(a,b)=>b.z-a.z;
function frame(ms){
  const now=ms/1000;
  const T=t0===null||now<t0?-1:now-t0;
  const dt=Math.min(0.1,(ms-ultimoMs)/1000);ultimoMs=ms;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sacudir(T,now);

  // tras la explosión la cámara viene de cerca, desde arriba y girando rápido
  const asenta=T>=0?1-salida(clamp(T/3.5)):0;
  empuje=1+0.6*asenta;
  cam.rot=cam.off+(T>0?T*0.04:0)-3.2*asenta;
  cr=Math.cos(cam.rot);sr=Math.sin(cam.rot);
  const tilt=cam.tilt+0.55*asenta;
  ct=Math.cos(tilt);st=Math.sin(tilt);

  fondo(T,now);
  if(t0!==null&&now<t0) dibujarCarga(now);
  if(T>=0){
    dibujarFugaz(T,now);
    dibujarConstelaciones(T,now);
    dibujarDisco(T);
    const ab=suave(clamp((T-6)/1.5));
    if(ab>0) calcularBurbujas(T);
    dibujarFrases(T,dt,ab);
    dibujarNucleo(T);
    if(ab>0){
      ordenBurbujas.sort(ordenProfundidad);
      for(const b of ordenBurbujas) if(b.z>0) dibujarBurbuja(b,ab);
    }
    dibujarFuente(T);
    dibujarCorazon(T);
    if(ab>0) for(const b of ordenBurbujas) if(b.z<=0) dibujarBurbuja(b,ab);
    dibujarChispas(T);
    dibujarOndas(T);
    destello(T);

    if(T>5&&!mostrado){
      mostrado=true;
      $('teamo').classList.add('ver');
      setTimeout(()=>{$('controles').classList.add('ver');$('pista').classList.add('ver');},2200);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Eventos ---------- */
if(document.fonts){
  document.fonts.ready.then(invalidar);
  document.fonts.addEventListener('loadingdone',invalidar);
}
function iniciar(){
  t0=performance.now()/1000+PRE;
  mostrado=false;
  frases.forEach(f=>f.al=0);
}
$('btnAbrir').addEventListener('click',()=>{
  $('intro').classList.add('oculto');
  iniciar();
  if(CONFIG.musica){musica=musica||new Audio(CONFIG.musica);musica.loop=true;musica.play().catch(()=>{});}
});
$('btnColor').addEventListener('click',()=>{
  const rojo=document.body.classList.toggle('rojo');
  tema=rojo?TEMAS.rojo:TEMAS.rosa;crearPaleta();invalidar();
});
$('btnRepetir').addEventListener('click',()=>{
  iniciar();cam.off=0;cam.tilt=0.42;cam.zoom=1;
  ['teamo','controles','pista'].forEach(id=>$(id).classList.remove('ver'));
});

function burbujaEn(x,y){
  const ordenadas=[...burbujas].sort((a,b)=>a.z-b.z);
  return ordenadas.find(b=>b.R&&Math.hypot(x-b.sx,y-b.sy)<b.R*1.1);
}
function abrirModal(b){
  const m=$('mMedia');
  m.innerHTML='';
  if(b.foto){const img=document.createElement('img');img.src=b.foto;img.alt=b.titulo;m.appendChild(img);}
  else{const s=document.createElement('span');s.textContent=b.emoji;m.appendChild(s);}
  $('mTitulo').textContent=b.titulo;
  $('mTexto').textContent=b.texto;
  $('modal').classList.add('abierto');
}
$('mVolver').addEventListener('click',()=>$('modal').classList.remove('abierto'));
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('abierto');});

let drag=null;
cv.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,m:0,off:cam.off,tilt:cam.tilt};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(drag){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag.m=Math.max(drag.m,Math.hypot(dx,dy));
    if(t0!==null){cam.off=drag.off-dx*0.006;cam.tilt=clamp(drag.tilt+dy*0.003,0.12,0.95);}
  }else{
    cv.style.cursor=t0!==null&&burbujaEn(e.clientX,e.clientY)?'pointer':'grab';
  }
});
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.m<6&&t0!==null){const b=burbujaEn(e.clientX,e.clientY);if(b)abrirModal(b);}
  drag=null;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.zoom=clamp(cam.zoom*(1-e.deltaY*0.001),0.7,1.6);
},{passive:false});
</script>
